<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#03080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOVA">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com https://tyler467890.github.io https://nova-api.tyler467890.workers.dev wss://nova-api.tyler467890.workers.dev; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
<title>NOVA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/rajdhani-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<script src="js/n3d-config.js"></script>
<link rel="stylesheet" href="3d/nova-3d.css">
<link rel="stylesheet" href="css/nova.css">
</head>
<body>
<!-- NOVA 2: every screen is the same empty grid. Screen 1 adds the 3D core; everything else lives in the core's nodes
     and opens as tabs that can be thrown to the left, centre or right screen. -->
<canvas id="grid" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<main id="stage">
  <section id="coreArea" data-n3d-core aria-label="NOVA core: drag to spin the globe in any direction, scroll to zoom, click a node to open it, double-click to turn it to the front. Arrow keys turn the globe, Enter opens the front node.">
    <div class="corepool" aria-hidden="true"></div>
    <div class="clock" aria-hidden="true"><b data-clock></b><span data-ampm></span></div>
    <nav class="corenav" id="corenav" aria-label="Open a tab"></nav>
  </section>
  <section id="tiles" aria-label="Open tabs"></section>
</main>
<div class="edge l" id="edgeL" aria-hidden="true"><span></span></div>
<div class="edge r" id="edgeR" aria-hidden="true"><span></span></div>
<button class="menubtn" id="menuBtn" type="button" aria-label="NOVA menu" aria-haspopup="true" aria-expanded="false" hidden></button>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="lock" id="lock" hidden>
  <div class="lockbox">
    <div class="lockring" id="lockring"></div>
    <div class="name">NOVA</div>
    <div class="label" id="locksub">Command center · locked</div>
    <form id="lockform" autocomplete="on">
      <input type="text" name="username" value="tyler" autocomplete="username" hidden>
      <input id="pass" name="password" type="password" placeholder="Enter passphrase" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Passphrase" required>
      <button class="go" id="go" type="submit">Unlock</button>
    </form>
    <div class="lockmsg" id="lockmsg">Remembered on this device until you press Lock.</div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
